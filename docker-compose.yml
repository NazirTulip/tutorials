services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  odoo:
    image: odoo:19
    depends_on:
      - db
    ports:
      - "8081:8069"
    volumes:
      - ./odoo:/odoo
      - ./tutorials:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf
    command: odoo -c /etc/odoo/odoo.conf --dev=all
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo

volumes:
  pgdata:
